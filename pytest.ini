[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unitaire: test d’une fonction isolée
    integration: test des interactions entre routes, fonctions et fichiers JSON
    fonctionnel: test d’un parcours utilisateur dans un navigateur Selenium
    performance: scénario destiné à Locust, hors suite pytest classique
